services:
  ketai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ket-ai
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - TZ=Europe/Istanbul
      - SANDBOX_URL=http://ket-sandbox:8080
    volumes:
      - ./config.json:/app/config.json:rw
      - ./system.txt:/app/system.txt:ro
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    depends_on:
      - ket-sandbox

  ket-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: ket-sandbox
    restart: unless-stopped
    ports:
      - "3276:8080"
    environment:
      - TZ=Europe/Istanbul
      - SANDBOX_PORT=8080
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
          pids: 150

networks:
  default:
    name: agalar-network
    external: true
